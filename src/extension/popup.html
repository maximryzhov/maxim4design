<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>maxim4design</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 280px;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
      background: #ffffff;
      color: #1f2937;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .logo {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: linear-gradient(135deg, #06b6d4, #8b5cf6, #ec4899);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 14px;
    }
    h1 {
      font-size: 14px;
      font-weight: 600;
      color: #111827;
    }
    .subtitle {
      font-size: 11px;
      color: #6b7280;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    button {
      width: 100%;
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid #d1d5db;
      background: #f9fafb;
      color: #374151;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
    }
    button:hover {
      background: #f3f4f6;
      border-color: #9ca3af;
    }
    button.primary {
      background: #18a0fb;
      color: white;
      border: none;
      font-weight: 600;
    }
    button.primary:hover {
      background: #0d8de3;
    }
    .status {
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 11px;
      text-align: center;
      display: none;
    }
    .status.success {
      display: block;
      background: #f0fdf4;
      color: #166534;
      border: 1px solid #bbf7d0;
    }
    .status.info {
      display: block;
      background: #eff6ff;
      color: #1e40af;
      border: 1px solid #bfdbfe;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">M</div>
    <div>
      <h1>maxim4design</h1>
      <div class="subtitle">HTML to Figma Extractor</div>
    </div>
  </div>

  <div class="btn-group">
    <button class="primary" id="capturePageBtn">
      📄 Захватить всю страницу
    </button>
    <button id="inspectElementBtn">
      🔍 Выбрать блок мышью
    </button>
  </div>

  <div id="status" class="status"></div>

  <script src="popup.js"></script>
</body>
</html>
