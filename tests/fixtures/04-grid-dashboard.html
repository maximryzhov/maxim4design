<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSS Grid Analytics Dashboard Test</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Inter, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 32px;
    }
    .dashboard {
      max-width: 1000px;
      margin: 0 auto;
    }
    .header {
      margin-bottom: 24px;
    }
    .header h1 {
      font-size: 24px;
      font-weight: 700;
    }
    .grid-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }
    .stat-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .stat-label {
      font-size: 13px;
      color: #94a3b8;
    }
    .stat-value {
      font-size: 28px;
      font-weight: 700;
      color: #ffffff;
    }
    .stat-trend {
      font-size: 12px;
      font-weight: 600;
      color: #10b981;
    }
    .stat-trend.down {
      color: #ef4444;
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <div class="header">
      <h1>Analytics Overview</h1>
    </div>
    <div class="grid-container">
      <div class="stat-card">
        <span class="stat-label">Total Revenue</span>
        <span class="stat-value">$124,500</span>
        <span class="stat-trend">+14.2% from last month</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Active Users</span>
        <span class="stat-value">48,210</span>
        <span class="stat-trend">+8.1% from last month</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Bounce Rate</span>
        <span class="stat-value">24.6%</span>
        <span class="stat-trend down">-2.4% from last month</span>
      </div>
    </div>
  </div>
</body>
</html>
